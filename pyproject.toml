[project]
name = "pepkio-journal-club-shuffle"
version = "0.1.0"
description = "Python client for Pepkio journal-club-shuffle tool"
readme = "README_PYPI.md"
authors = [
    { name = "Pepkio Team", email = "support@pepkio.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "h2>=4.4.1",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-journal-club-shuffle = "pepkio_journal_club_shuffle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_journal_club_shuffle"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
